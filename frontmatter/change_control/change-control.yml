name: Change control

on:
  pull_request:
    paths:
      - "frontmatter/change_control/**"
      - "frontmatter/tests/schemas/**"
      - "frontmatter/governance/**"

permissions:
  contents: read

jobs:
  validate-change-control:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontmatter/change_control/package-lock.json

      - name: Install dependencies
        working-directory: frontmatter/change_control
        run: npm ci

      - name: Detect invisible structural changes
        run: node frontmatter/change_control/detect-schema-change.mjs

      - name: Validate structural change history
        run: node frontmatter/change_control/validate-change-control.mjs
