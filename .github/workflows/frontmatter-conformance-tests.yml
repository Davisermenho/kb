name: Front Matter Conformance Tests

on:
  pull_request:
    paths:
      - "frontmatter/**"

  push:
    branches:
      - main
    paths:
      - "frontmatter/**"

permissions:
  contents: read

jobs:
  conformance-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontmatter/tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontmatter/tests/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run conformance tests
        run: npm test

      - name: Upload conformance report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-report
          path: frontmatter/tests/tests/reports/conformance-report.json
