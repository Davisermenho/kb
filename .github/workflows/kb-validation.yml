name: KB validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit and integration tests
        run: python3 -m unittest discover -s tests -v
      - name: Structural checker
        run: python3 ferramentas/check_kb_consistency.py .
      - name: Audit gates
        run: python3 ferramentas/kb_validate.py .
